components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    AuthorizationId:
      name: authorizationId
      in: path
      required: true
      schema: { type: string, format: uuid }
    ProductResourceId:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    SubjectType:
      name: subjectType
      in: path
      required: true
      schema: { type: string, enum: [FAMILY, MODEL, SKU, BATCH, ITEM] }
    SubjectId:
      name: subjectId
      in: path
      required: true
      schema: { type: string, format: uuid }
    SchemaVersionId:
      name: schema_version_id
      in: query
      required: true
      schema: { type: string, format: uuid }
    TenantContext:
      name: x-tenant-id
      in: header
      required: true
      schema: { type: string, format: uuid }
      description: Requested scope only; authority is resolved server-side.
    CorrelationId:
      name: x-correlation-id
      in: header
      required: false
      schema: { type: string, maxLength: 128 }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string, minLength: 8, maxLength: 128 }
  responses:
    Success:
      description: Successful response. Every response includes x-correlation-id.
      headers:
        x-correlation-id:
          schema: { type: string }
      content:
        application/json:
          schema:
            type: object
            required: [data]
            properties:
              data: {}
    Error:
      description: Safe error without existence or credential leakage.
      headers:
        x-correlation-id:
          schema: { type: string }
      content:
        application/json:
          schema:
            type: object
            required: [error]
            properties:
              error:
                type: object
                required: [code, message, correlation_id]
                properties:
                  code: { type: string }
                  message: { type: string }
                  correlation_id: { type: string }
