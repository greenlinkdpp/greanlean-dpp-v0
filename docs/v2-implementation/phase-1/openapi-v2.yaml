openapi: 3.1.0
info:
  title: GreanLean API V2 Phase 1 through Phase 5
  version: 2.0.0-phase5
  description: Capability-gated Development-only core and Integration API. Phase 5 covers safe Connector, Job, Receipt, Import, TEST Registry, Webhook, Polling, and BMS aggregation boundaries.
servers:
  - url: http://localhost:3000
    description: Isolated Development only
security:
  - bearerAuth: []
